name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build and export Docker image
        run: |
          docker build --tag ella-api:ci .
          docker save ella-api:ci | gzip > /tmp/ella-api.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ella-api-image
          path: /tmp/ella-api.tar.gz
          retention-days: 1

  integration:
    needs: quality
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: ella_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ella-api-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/ella-api.tar.gz

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Wait for DB to accept connections
        run: |
          for attempt in $(seq 1 30); do
            if docker exec shop-db pg_isready -U "$DB_USERNAME" -d "$DB_DATABASE" > /dev/null 2>&1; then
              echo "DB ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "DB not ready yet (attempt ${attempt}/30) — waiting 3s"
            sleep 3
          done
          echo "DB did not become ready in time"
          docker compose logs db
          exit 1

      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://localhost:4000/; then
              echo ""
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "API not ready yet (attempt ${attempt}/60) — waiting 3s"
            sleep 3
          done
          echo "API did not become ready after 180s"
          echo "--- docker compose logs ---"
          docker compose logs --no-color
          exit 1

      - name: Run k6 smoke load test
        run: k6 run qa/k6-script.js

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
